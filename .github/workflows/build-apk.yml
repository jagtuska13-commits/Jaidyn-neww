name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Create .env from secret
        run: |
          echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" > .env
          echo "CHAT_MODEL=${{ vars.CHAT_MODEL || 'mistral-small-latest' }}" >> .env
          echo "TTS_VOICE=${{ vars.TTS_VOICE || 'gb_jane_neutral' }}" >> .env
          echo "MUSIC_API_URL=${{ vars.MUSIC_API_URL || 'https://api.replicate.com/v1/predictions' }}" >> .env
          echo "MUSIC_API_TOKEN=${{ secrets.MUSIC_API_TOKEN }}" >> .env
          echo "MUSIC_MODEL_VERSION=${{ vars.MUSIC_MODEL_VERSION }}" >> .env

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaggedgem-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jaggedgem-v${{ github.run_number }}
          name: Stratagem build ${{ github.run_number }}
          body: Automated APK build. Download app-debug.apk and install it on your phone (allow installs from unknown sources).
          files: app/build/outputs/apk/debug/app-debug.apk
