name: Diagnose backend

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Mistral streaming with document-sized payload
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL || 'mistral-large-latest' }}
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, os
          key = os.environ["MISTRAL_API_KEY"]
          model = os.environ["CHAT_MODEL"].strip() or "mistral-large-latest"
          doc_like = "[Attached document: agreement.pdf]\n" + ("The tenant agrees to pay rent of $450 per week, due each Friday. Clause 14: the landlord may end the agreement with 30 days notice. " * 60) + "\n\nThe user shared this with no message - summarize the key facts."
          def blocks(content):
              if isinstance(content, str): return [("text", content)]
              out = []
              items = content if isinstance(content, list) else [content]
              for it in items:
                  if isinstance(it, dict):
                      t = it.get("type")
                      if t == "thinking":
                          for sub in it.get("thinking", []) if isinstance(it.get("thinking"), list) else []:
                              if isinstance(sub, dict) and sub.get("text"): out.append(("thinking", sub["text"]))
                      elif t == "text": out.append(("text", it.get("text","")))
              return out
          def stream(label, extra):
              body = {"model": model, "messages": [{"role":"user","content":doc_like}], "stream": True}
              body.update(extra)
              req = urllib.request.Request("https://api.mistral.ai/v1/chat/completions",
                  data=json.dumps(body).encode(),
                  headers={"Authorization": "Bearer "+key, "Content-Type": "application/json", "Accept": "text/event-stream"})
              t0 = time.time(); first_text = None; thinking_chars = 0; text_chars = 0; kinds = set()
              try:
                  with urllib.request.urlopen(req, timeout=240) as r:
                      print(f"[{label}] HTTP {r.status}")
                      for raw in r:
                          line = raw.decode("utf-8","replace").strip()
                          if not line.startswith("data:"): continue
                          data = line[5:].strip()
                          if data == "[DONE]": break
                          try: chunk = json.loads(data)
                          except Exception: continue
                          ch = (chunk.get("choices") or [{}])[0]
                          d = ch.get("delta") or {}
                          c = d.get("content")
                          if c is None: continue
                          for kind, txt in blocks(c):
                              kinds.add(kind)
                              if kind == "thinking": thinking_chars += len(txt)
                              else:
                                  text_chars += len(txt)
                                  if first_text is None: first_text = time.time()-t0
                  print(f"[{label}] kinds={sorted(kinds)} thinking_chars={thinking_chars} text_chars={text_chars} first_text={None if first_text is None else round(first_text,1)}s total={round(time.time()-t0,1)}s")
              except Exception as e:
                  eb = ""
                  try:
                      if hasattr(e, "read"): eb = e.read().decode()[:300]
                  except Exception: pass
                  print(f"[{label}] FAILED after {round(time.time()-t0,1)}s: {e} | {eb}")
          print("Model:", model)
          stream("baseline", {})
          stream("thinking-disabled", {"thinking": "disabled"})
          stream("reasoning-false", {"reasoning": {"enabled": False}})
          stream("effort-none", {"reasoning_effort": "none"})
          stream("effort-low", {"reasoning_effort": "low"})
          stream("low-effort-alt", {"low_effort": True})
          PY
